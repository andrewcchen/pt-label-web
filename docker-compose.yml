services:
  brother_ql_web:
    image: ghcr.io/dl6er/brother-ql-web:latest # latest online version
    # build: . # building locally from source (see git clone below))
    container_name: brother_ql_web
    restart: always
    ports:
      - "8013:8013"
    environment:
      - TZ=Europe/Berlin
      - LABEL_DEFAULT_SIZE=tze24
      - LABEL_DEFAULT_ORIENTATION=standard
      - PRINTER_MODEL=PT-P750W
      - PRINTER_PRINTER=file:///dev/usb/lp0
#    devices:
#      - "/dev/usb/lp0:/dev/usb/lp0"
    volumes:
      - ./labels:/app/labels
      - /etc/timezone:/etc/timezone:ro
    network_mode: host # needed for direct TCP printer access
