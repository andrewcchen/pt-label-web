services:
  brother_ql_web:
    build: .
    container_name: brother_ql_web
    restart: always
    ports:
      - "8013:8013"
    environment:
      - LABEL_DEFAULT_SIZE=tze24
      - LABEL_DEFAULT_ORIENTATION=standard
      - PRINTER_MODEL=PT-P750W
      - PRINTER_PRINTER=file:///dev/usb/lp0
#    devices:
#      - "/dev/usb/lp0:/dev/usb/lp0"
    volumes:
      - ./labels:/app/labels
